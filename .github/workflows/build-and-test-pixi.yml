name: Build and Test - Pixi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build VRS on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-latest, ubuntu-latest, windows-2022] # note: macos builds are arm only
    steps:
      - name : Setup repo
        uses: actions/checkout@v7

      - name : Remove Mono framework
        if: runner.os == 'macOS'
        run:
          sudo rm -rf /Library/Frameworks/Mono.framework
          sudo pkgutil --forget com.xamarin.mono-MDK.pkg
          sudo rm /etc/paths.d/mono-commands

      - name : Setup pixi
        uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.44.0
          cache: false
          post-cleanup: true

      - name: Build
        run: pixi run build

      - name: Test
        run: pixi run test

      - name: Test installed CMake package
        run: pixi run test-consumer
